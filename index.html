<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Documentation for the BRTrains family of OpenTTD NewGRFs.">
  <title>BRTrains documentation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#/"><span class="wordmark-mark">BR</span><span>BRTrains <b>docs</b></span></a>
    <div class="header-actions"><button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle dark mode">◐</button></div>
  </header>
  <div id="app" class="app-shell">
    <section id="project-landing" class="landing view">
      <div class="landing-copy"><div class="eyebrow">OpenTTD NewGRFs</div><h1>The BRTrains family,<br><span>documented.</span></h1><p class="lead">Explore the trains, trams and liveries that make up the BRTrains group of NewGRFs for OpenTTD.</p></div>
      <div class="section-label"><span>Projects</span><span class="section-line"></span></div>
      <div id="project-grid" class="project-grid"><div class="loading-card">Loading projects…</div></div>
    </section>
    <section id="project-docs" class="docs-view view hidden">
      <aside class="docs-nav">
        <button id="back-projects" class="back-link" type="button">← Projects</button>
        <div class="project-nav-title"><span id="nav-project-mark" class="mini-roundel">BR</span><div><strong id="nav-project-name">Project</strong><small>OpenTTD NewGRF</small></div></div>
        <div class="nav-label">Documentation</div>
        <nav id="docs-nav-links" aria-label="Documentation sections">
          <button class="nav-link active" data-section="overview" type="button"><span>Overview</span></button>
          <button class="nav-link" data-section="vehicles" type="button"><span>Vehicles</span><small id="nav-vehicle-count"></small></button>
          <button class="nav-link" data-section="liveries" type="button"><span>Liveries</span><small id="nav-livery-count"></small></button>
          <button class="nav-link" data-section="about" type="button"><span>Using the GRF</span></button>
        </nav>
        <div class="nav-footer"><button class="nav-link muted-link" type="button" disabled><span>Maintainer docs</span><small>soon</small></button></div>
      </aside>
      <main class="docs-main"><div class="docs-topline"><span>BRTrains / <strong id="docs-project-label">Project</strong></span><span class="docs-mode">User documentation</span></div><div id="docs-content"></div></main>
    </section>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
