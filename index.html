<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Documentation for the BRTrains family of OpenTTD NewGRFs.">
  <title>BRTrains documentation</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#/"><span class="wordmark-mark">BR</span><span>BRTrains <b>docs</b></span></a>
    <div class="header-actions"><div class="theme-choices" role="group" aria-label="Colour theme"><button class="theme-choice" type="button" data-theme-choice="light">Light</button><button class="theme-choice" type="button" data-theme-choice="dark">Dark</button><button class="theme-choice" type="button" data-theme-choice="system">System</button></div></div>
  </header>
  <div id="app" class="app-shell">
    <section id="project-landing" class="landing view">
      <div class="landing-copy"><div class="eyebrow">OpenTTD NewGRFs</div><h1><span class="hero-light">The </span><span class="hero-red">BRTrains</span><span class="hero-light"> family</span></h1><p class="lead">Explore the trains, trams and liveries that make up the BRTrains group of NewGRFs for OpenTTD.</p></div>
      <div class="section-label"><span>Projects</span><span class="section-line"></span></div>
      <div id="project-grid" class="project-grid"><div class="loading-card">Loading projects…</div></div>
    </section>
    <section id="project-docs" class="docs-view view hidden">
      <aside class="docs-nav">
        <button id="back-projects" class="back-link" type="button">← Projects</button>
        <div class="project-nav-title"><span id="nav-project-mark" class="mini-roundel">BR</span><div><strong id="nav-project-name">Project</strong><small>OpenTTD NewGRF</small></div></div>
        <div class="nav-label">Documentation</div>
        <nav id="docs-nav-links" aria-label="Documentation sections">
          <button class="nav-link active" data-section="overview" type="button"><span>Overview</span></button>
          <button class="nav-link" data-section="vehicles" type="button"><span>Vehicles</span><small id="nav-vehicle-count"></small></button>
          <button class="nav-link" data-section="liveries" type="button"><span>Liveries</span><small id="nav-livery-count"></small></button>
          <button class="nav-link" data-section="about" type="button"><span>Using the GRF</span></button>
        </nav>
        <div class="nav-footer"><button class="nav-link" data-section="maintainer" type="button"><span>Maintainer docs</span><small>YAML &amp; artwork</small></button><div class="admin-area"><button id="admin-toggle" class="admin-toggle" type="button" aria-label="Maintainer login">•••</button><form id="admin-login" class="admin-login hidden"><input id="admin-password" type="password" autocomplete="current-password" placeholder="Password"><button type="submit">Log in</button><button id="admin-logout" type="button" class="hidden">Log out</button><span id="admin-status" role="status"></span></form></div></div>
      </aside>
      <main class="docs-main"><div class="docs-topline"><span>BRTrains / <strong id="docs-project-label">Project</strong></span></div><div id="docs-content"></div></main>
    </section>
  </div>
  <script src="maintainer-docs.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
